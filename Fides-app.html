<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fides Money · Edição de Maio</title>
<meta name="theme-color" content="#2D5A3D"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/fides.css"/>
<link rel="stylesheet" href="assets/fides-studio.css"/>
<link rel="stylesheet" href="assets/fides-store.css"/>
<link rel="stylesheet" href="assets/fides-orcamento.css"/>
<link rel="stylesheet" href="assets/fides-contas.css"/>
<link rel="stylesheet" href="assets/fides-metas.css"/>
<link rel="stylesheet" href="assets/fides-claude.css"/>

<style>
  /* ─── Standalone overrides ─────────────────────────────────
     The canvas uses a fixed 1440px width for side-by-side
     artboards. In standalone, fill the viewport. */
  html, body { margin: 0; height: 100%; background: var(--bg, #F4F5F1); }
  body { font-family: 'Manrope', ui-sans-serif, system-ui; }
  #root { min-height: 100%; }

  .fds-studio {
    width: 100% !important;
    min-height: 100vh;
  }
  .fds-studio .fds-sb-slim {
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .fds-studio .stu-mast {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(8px);
    background: color-mix(in oklab, var(--bg, #F4F5F1) 88%, transparent);
  }

  /* Wider page padding on big screens */
  @media (min-width: 1600px) {
    .fds-studio .stu-mast { padding-left: 48px; padding-right: 48px; }
    .fds-studio .stu-page { padding-left: 48px; padding-right: 48px; }
  }

  /* Modal backdrop covers full viewport in standalone */
  .fds-modal-backdrop { position: fixed !important; inset: 0; }

  /* Hide masthead search on small screens to avoid wrap */
  @media (max-width: 1100px) {
    .fds-studio .stu-mast-search { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="assets/fides-data.jsx"></script>
<script type="text/babel" src="assets/fides-store.jsx"></script>
<script type="text/babel" src="assets/fides-charts.jsx"></script>
<script type="text/babel" src="assets/fides-shell.jsx"></script>
<script type="text/babel" src="assets/fides-dashboard.jsx"></script>
<script type="text/babel" src="assets/fides-transacoes.jsx"></script>
<script type="text/babel" src="assets/fides-studio.jsx"></script>
<script type="text/babel" src="assets/fides-orcamento.jsx"></script>
<script type="text/babel" src="assets/fides-contas.jsx"></script>
<script type="text/babel" src="assets/fides-metas.jsx"></script>
<script type="text/babel" src="assets/fides-claude.jsx"></script>

<script type="text/babel" data-presets="react">
  // Read initial page from URL hash so deep-links work in dev / Vercel
  // (?page=orcamento or #orcamento)
  function readInitialPage() {
    const hash = (location.hash || '').replace('#','').trim();
    const params = new URLSearchParams(location.search);
    const p = hash || params.get('page') || 'dashboard';
    const valid = ['dashboard','transacoes','orcamento','planejamento','contas','metas','dividas','familia'];
    const alias = { planejamento: 'orcamento' };
    const out = alias[p] || p;
    return valid.includes(p) ? out : 'dashboard';
  }

  function App() {
    const [page, setPage] = React.useState(readInitialPage);
    React.useEffect(() => {
      const onHash = () => setPage(readInitialPage());
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);
    return <FidesStudio page={page}/>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
