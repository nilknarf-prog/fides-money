<style>
  /* ─── Standalone overrides ─────────────────────────────────
     The canvas uses a fixed 1440px width for side-by-side
     artboards. In standalone, fill the viewport. */
  html {
    margin: 0;
    height: 100%;
    background: var(--bg, #F4F5F1);
    /* clip não cria scroll container — position:fixed ancora no viewport real no iOS Safari */
    overflow-x: clip;
    max-width: 100vw;
    scroll-behavior: smooth;
  }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg, #F4F5F1);
    overflow-x: clip;
    font-family: 'Manrope', ui-sans-serif, system-ui;
  }
  #root {
    min-height: 100%;
    overflow-x: clip;
    /* Contain any child that might try to push beyond viewport */
    max-width: 100vw;
  }

  .fds-studio {
    width: 100% !important;
    max-width: 100vw;
    min-height: 100vh;
    overflow-x: clip;
  }

  /* Old fds-app wrapper (if it renders anywhere) must also be contained */
  .fds-app {
    width: 100% !important;
    max-width: 100vw !important;
    overflow-x: clip;
  }

  /* Sidebar sticky em desktop */
  @media (min-width: 769px) {
    .fds-studio .fds-sb-slim {
      position: sticky;
      top: 0;
      height: 100vh;
    }
  }

  .fds-studio .stu-mast {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(8px);
    background: color-mix(in oklab, var(--bg, #F4F5F1) 88%, transparent);
  }

  /* Mobile: remove backdrop-filter from masthead to avoid creating a containing block
     for position:fixed children (picker, notif panel) */
  @media (max-width: 768px) {
    .fds-studio .stu-mast { backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* Wider page padding on big screens */
  @media (min-width: 1600px) {
    .fds-studio .stu-mast { padding-left: 48px; padding-right: 48px; }
    .fds-studio .stu-page { padding-left: 48px; padding-right: 48px; }
  }

  /* Modal backdrop covers full viewport in standalone */
  .fds-modal-backdrop { position: fixed !important; inset: 0; }

  /* Hide masthead search on medium screens */
  @media (max-width: 1100px) {
    .fds-studio .stu-mast-search { display: none; }
  }
</style>
</head>

<script type="text/babel" data-presets="react">
  // Read initial page from URL hash so deep-links work in dev / Vercel
  // (?page=orcamento or #orcamento)
  function readInitialPage() {
    const hash = (location.hash || '').replace('#','').trim();
    const params = new URLSearchParams(location.search);
    const p = hash || params.get('page') || 'dashboard';
    const valid = ['dashboard','transacoes','orcamento','planejamento','contas','metas','dividas','familia'];
    const alias = { planejamento: 'orcamento' };
    const out = alias[p] || p;
    return valid.includes(p) ? out : 'dashboard';
  }

  function App() {
    const [page, setPage] = React.useState(readInitialPage);
    React.useEffect(() => {
      const onHash = () => setPage(readInitialPage());
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);
    return <FidesStudio page={page}/>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
